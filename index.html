<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-app">

  <aside class="sidebar">
    <h2>Chats</h2>

    <div class="user active">
      <img src="https://i.pravatar.cc/40?img=1">
      <div>
        <p class="name">Alex</p>
        <span>Typing...</span>
      </div>
    </div>

    <div class="user">
      <img src="https://i.pravatar.cc/40?img=2">
      <div>
        <p class="name">Emma</p>
        <span>See you soon</span>
      </div>
    </div>

  </aside>

  <main class="chat">
    <header class="chat-header">
      <img src="https://i.pravatar.cc/40?img=1">
      <h3>Alex</h3>
    </header>

    <div class="messages">
      <div class="msg received">Hey! How are you?</div>
      <div class="msg sent">I'm good 😊 What about you?</div>
      <div class="msg received">All good! Want to catch up?</div>
    </div>

    <footer class="chat-input">
      <input type="text" placeholder="Type a message...">
      <button>➤</button>
    </footer>
  </main>
Thiis line was added in feature branch.
</div>

</body>
</html>
